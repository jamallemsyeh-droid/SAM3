name: Build SAM3 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unpack and locate Expo project
        shell: bash
        run: |
          set -euxo pipefail
          unzip -o SAM3-project.zip -d extracted
          PACKAGE_JSON="$(find extracted -type f -name package.json -not -path '*/node_modules/*' | head -n 1)"
          if [ -z "$PACKAGE_JSON" ]; then
            echo "No package.json found in SAM3-project.zip"
            find extracted -maxdepth 4 -type f | sort | head -n 200
            exit 1
          fi
          APP_DIR="$(dirname "$PACKAGE_JSON")"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Found app in: $APP_DIR"
          cat "$PACKAGE_JSON"

      - name: Install dependencies
        run: |
          cd "$APP_DIR"
          npm install

      - name: Create required notification icon
        run: |
          mkdir -p "$APP_DIR/assets"
          python3 - "$APP_DIR/assets/notification-icon.png" <<'PY'
          import math, struct, zlib, sys
          w = h = 96
          raw = bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  d = math.hypot(x - 48, y - 48)
                  a = 255 if d <= 34 else 0
                  raw.extend((255, 255, 255, a))
          def chunk(t, data):
              return struct.pack(">I", len(data)) + t + data + struct.pack(">I", zlib.crc32(t + data) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">2I5B", w, h, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(bytes(raw), 9))
          png += chunk(b"IEND", b"")
          open(sys.argv[1], "wb").write(png)
          PY

      - name: Generate Android project
        run: |
          cd "$APP_DIR"
          CI=1 npx expo prebuild --platform android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAM3-demo-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
