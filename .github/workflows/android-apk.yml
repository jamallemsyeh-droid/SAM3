name: Build SAM3 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SAM3-project.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unpack project
        run: |
          unzip -o SAM3-project.zip
          test -f SAM3/package.json
      - name: Install dependencies
        working-directory: SAM3
        run: npm install
      - name: Generate Android project
        working-directory: SAM3
        run: npx expo prebuild --platform android --non-interactive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: SAM3/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SAM3-demo-apk
          path: SAM3/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
