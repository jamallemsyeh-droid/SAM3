name: Build SAM3 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unpack and locate Expo project
        shell: bash
        run: |
          set -euxo pipefail
          unzip -o SAM3-project.zip -d extracted
          PACKAGE_JSON="$(find extracted -type f -name package.json -not -path '*/node_modules/*' | head -n 1)"
          test -n "$PACKAGE_JSON"
          APP_DIR="$(dirname "$PACKAGE_JSON")"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          cat "$PACKAGE_JSON"

      - name: Install dependencies
        run: |
          cd "$APP_DIR"
          npm install

      - name: Normalize Expo module publication metadata
        shell: bash
        run: |
          python3 - "$APP_DIR/node_modules" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          patched = []
          def visit(value, version):
              changed = False
              if isinstance(value, dict):
                  publication = value.get("publication")
                  if isinstance(publication, dict) and not publication.get("version") and version:
                      publication["version"] = version
                      changed = True
                  for child in value.values():
                      changed = visit(child, version) or changed
              elif isinstance(value, list):
                  for child in value:
                      changed = visit(child, version) or changed
              return changed
          for config in root.rglob("expo-module.config.json"):
              try:
                  data = json.loads(config.read_text())
                  pkg = json.loads((config.parent / "package.json").read_text())
              except (OSError, ValueError):
                  continue
              version = pkg.get("version")
              if visit(data, version):
                  config.write_text(json.dumps(data, indent=2) + "\n")
                  patched.append(f"{pkg.get('name', config.parent.name)}@{version}")
          print("Patched Expo module configs:", patched or "none")
          PY

      - name: Create notification icon
        run: |
          mkdir -p "$APP_DIR/assets"
          python3 - "$APP_DIR/assets/notification-icon.png" <<'PY'
          import math, struct, zlib, sys
          w = h = 96
          raw = bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  a = 255 if math.hypot(x-48,y-48) <= 34 else 0
                  raw.extend((255,255,255,a))
          def chunk(t,d):
              return struct.pack(">I",len(d))+t+d+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)
          png=b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">2I5B",w,h,8,6,0,0,0))+chunk(b"IDAT",zlib.compress(bytes(raw),9))+chunk(b"IEND",b"")
          open(sys.argv[1],"wb").write(png)
          PY

      - name: Generate Android project
        run: |
          cd "$APP_DIR"
          CI=1 npx expo prebuild --platform android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set Android compile SDK for Expo Asset
        shell: bash
        run: |
          python3 - "$APP_DIR/android/build.gradle" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          patterns = [
              r'(compileSdkVersion\s*=\s*)36\b',
              r'(compileSdk\s*=\s*)36\b',
              r'(compileSdkVersion\s+)36\b',
          ]
          for pattern in patterns:
              s, count = re.subn(pattern, r'\g<1>37', s)
              if count:
                  p.write_text(s)
                  print(f"Updated compile SDK references: {count}")
                  break
          else:
              print("No explicit API 36 compile SDK assignment found; showing relevant lines:")
              print("\n".join(line for line in s.splitlines() if "compileSdk" in line))
              raise SystemExit("Could not update compile SDK to 37")
          PY

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAM3-demo-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
