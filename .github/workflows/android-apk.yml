name: Build SAM3 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unpack and locate Expo project
        shell: bash
        run: |
          set -euxo pipefail
          unzip -o SAM3-project.zip -d extracted
          PACKAGE_JSON="$(find extracted -type f -name package.json -not -path '*/node_modules/*' | head -n 1)"
          test -n "$PACKAGE_JSON"
          APP_DIR="$(dirname "$PACKAGE_JSON")"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          mkdir -p "$APP_DIR/src/components"
          cp app-code/src/components/AudioControls.tsx "$APP_DIR/src/components/AudioControls.tsx"
          cp app-code/app.json "$APP_DIR/app.json"
          python3 - "$PACKAGE_JSON" "$APP_DIR/app/index.tsx" <<'PY'
          import json,sys
          p=sys.argv[1]
          d=json.load(open(p))
          d.setdefault("dependencies", {})["react-native-audio-api"]="*"
          with open(p,"w") as f:
              json.dump(d,f,indent=2)
              f.write("\\n")
          p=sys.argv[2]
          s=open(p).read()
          s=s.replace("  const [active, setActive] = useState(false);\\n","")
          s=s.replace("<AudioControls active={active} onToggle={() => setActive(v => !v)} />","<AudioControls />")
          open(p,"w").write(s)
          PY
          cat "$PACKAGE_JSON"

      - name: Pin SDK 54 compatible React and Expo packages
        shell: bash
        run: |
          set -euxo pipefail
          python3 - "$APP_DIR/package.json" <<'PY'
          import json, sys
          p=sys.argv[1]
          d=json.load(open(p))
          deps=d.setdefault("dependencies", {})
          deps["expo-audio"]="~1.1.1"
          deps["react-native"]="0.81.5"
          deps["react-dom"]="19.1.0"
          with open(p,"w") as f:
              json.dump(d,f,indent=2)
              f.write("\n")
          PY

      - name: Install dependencies
        run: |
          cd "$APP_DIR"
          npm install

      - name: Align Expo dependencies with SDK 54
        shell: bash
        run: |
          set -euxo pipefail
          cd "$APP_DIR"
          npx expo install --fix
          npx expo install expo-constants expo-linking expo-asset
          npm dedupe
          npx expo-doctor

      - name: Create notification icon
        run: |
          mkdir -p "$APP_DIR/assets"
          python3 - "$APP_DIR/assets/notification-icon.png" <<'PY'
          import math, struct, zlib, sys
          w = h = 96
          raw = bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  a = 255 if math.hypot(x-48,y-48) <= 34 else 0
                  raw.extend((255,255,255,a))
          def chunk(t,d):
              return struct.pack(">I",len(d))+t+d+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)
          png=b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">2I5B",w,h,8,6,0,0,0))+chunk(b"IDAT",zlib.compress(bytes(raw),9))+chunk(b"IEND",b"")
          open(sys.argv[1],"wb").write(png)
          PY

      - name: Generate Android project
        run: |
          cd "$APP_DIR"
          CI=1 npx expo prebuild --platform android

      - name: Bundle JavaScript into Android APK assets
        shell: bash
        run: |
          set -euxo pipefail
          cd "$APP_DIR"
          mkdir -p android/app/src/main/assets android/app/src/main/res
          npx expo export:embed --platform android --dev false --entry-file node_modules/expo-router/entry.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
          test -s android/app/src/main/assets/index.android.bundle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAM3-demo-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
